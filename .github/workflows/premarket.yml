name: Premarket agent refresh

on:
  schedule:
    # GitHub scheduled jobs can be delayed. These lightweight UTC attempts span
    # the premarket window and the gate below permits only one full refresh.
    - cron: '11 7-13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: premarket-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Check whether this attempt should refresh
        id: premarket_gate
        run: python scripts/should_run_premarket.py --report public/data/latest.json

      - name: Install the free-data pipeline
        if: steps.premarket_gate.outputs.should_run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Run the agent network
        if: steps.premarket_gate.outputs.should_run == 'true'
        env:
          SEC_USER_AGENT: SignalDesk stock-analyst@users.noreply.github.com
        run: python scripts/run_agents.py

      - name: Validate the exported report
        if: steps.premarket_gate.outputs.should_run == 'true'
        run: python scripts/validate_report.py public/data/latest.json

      - name: Publish changed market data
        if: steps.premarket_gate.outputs.should_run == 'true'
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add public/data/latest.json public/data/history
          if git diff --cached --quiet; then
            echo "No report change to publish."
            exit 0
          fi
          git commit -m "data: refresh premarket briefing"
          git push
