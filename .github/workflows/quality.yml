name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_report.py public/data/latest.json
