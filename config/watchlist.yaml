# Markets that trade before New York or often transmit cross-asset risk.
global_markets:
  - { symbol: ^N225, label: Nikkei 225, region: Japan, category: index }
  - { symbol: ^HSI, label: Hang Seng, region: Hong Kong, category: index }
  - { symbol: 000001.SS, label: Shanghai Composite, region: China, category: index }
  - { symbol: ^KS11, label: KOSPI, region: South Korea, category: index }
  - { symbol: ^TWII, label: Taiwan Weighted, region: Taiwan, category: index }
  - { symbol: ^AXJO, label: ASX 200, region: Australia, category: index }
  - { symbol: ^STOXX50E, label: Euro Stoxx 50, region: Europe, category: index }
  - { symbol: CL=F, label: WTI Crude, region: Global, category: commodity }
  - { symbol: DX-Y.NYB, label: US Dollar Index, region: Global, category: currency }
