sec_user_agent: SignalDesk research contact@example.com
review_queue_limit: 50

# Keyless headline feeds. The collector stores only titles, timestamps, and
# source links for a fast human review; it does not copy article bodies.
source_feeds:
  - name: Nikkei Asia
    url: https://asia.nikkei.com/rss/feed/nar
    source_type: international
    region: Asia
    topic: asia-markets
    max_items: 10
  - name: CNA Asia
    url: https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6511
    source_type: international
    region: Asia
    topic: asia-markets
    max_items: 10
  - name: CNA Business
    url: https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6936
    source_type: international
    region: Asia
    topic: business
    max_items: 10
  - name: CNBC Television on YouTube
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCvJJ_dzjViJCoLf5uKUTwoA
    source_type: video
    region: Global
    topic: markets
    max_items: 8
  - name: Bloomberg Television on YouTube
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCIALMKvObZNtJ6AmdCLP7Lg
    source_type: video
    region: Global
    topic: markets
    max_items: 8
